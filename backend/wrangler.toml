name = "linklang-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
CORS_ORIGIN = "http://localhost:5173,http://127.0.0.1:5173,https://linklang.co.uk,https://www.linklang.co.uk"
CONTACT_INBOX_EMAIL = "meereck@gmail.com"

[env.production]
vars = { CORS_ORIGIN = "https://linklang.co.uk,https://www.linklang.co.uk", CONTACT_INBOX_EMAIL = "meereck@gmail.com" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "linklang-db"
database_id = "42c7f834-5151-4e19-8c52-e6d9835aedd6"
migrations_dir = "migrations"

# Secrets — never put these here, set them with:
#   wrangler secret put JWT_SECRET
#   wrangler secret put RESEND_API_KEY
