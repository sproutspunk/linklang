# Single source of truth for the "linklang-api" Worker.
#
# NOTE: This file intentionally defines only `[env.production]` and no
# default (top-level) `[vars]` / `[[d1_databases]]` / `routes`. Previously
# both a default environment and `[env.production]` declared the SAME
# worker `name` and the SAME custom domain `routes`, which meant whichever
# `wrangler deploy` command ran last (with or without `--env production`)
# silently won the route and could overwrite the other environment's
# bindings. All deploys and local dev now explicitly target
# `--env production` (see backend/package.json and
# .github/workflows/deploy.yml) so there is only ever one environment that
# can serve `api.linklang.co.uk`.
name = "linklang-api"
main = "backend/src/index.ts"
compatibility_date = "2024-11-01"

[env.production]
name = "linklang-api"
routes = [
  { pattern = "api.linklang.co.uk", custom_domain = true }
]
vars = { CORS_ORIGIN = "https://linklang.co.uk,https://www.linklang.co.uk", CONTACT_INBOX_EMAIL = "meereck@gmail.com" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "linklang-db"
database_id = "42c7f834-5151-4e19-8c52-e6d9835aedd6"
migrations_dir = "backend/migrations"
