name: Validate LinkLang contact form

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "wrangler.toml"
      - ".github/workflows/validate-contact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck LinkLang backend
        run: npm run typecheck -w backend
      - name: Build frontend
        run: npm run build -w frontend
      - name: Verify contact form acceptance checks
        run: node --test backend/tests/contact-flow.test.cjs
